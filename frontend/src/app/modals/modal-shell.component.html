<div class="mdl-backdrop" (click)="requestClose()">
  <div
    class="mdl-panel"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="headingId"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    [style.max-width.px]="maxWidth()"
    (click)="$event.stopPropagation()"
  >
    <div class="mdl-head">
      <h2 class="mdl-title" [id]="headingId" tabindex="-1" cdkFocusInitial>{{ heading() }}</h2>
      <button
        class="mdl-close"
        type="button"
        aria-label="Close"
        [disabled]="modal.mutationPending()"
        (click)="requestClose()"
      >
        ✕
      </button>
    </div>
    @if (modal.mutationPending()) {
      <p role="status" aria-live="polite">Saving. Please wait.</p>
    }
    <div class="mdl-body">
      <ng-content />
    </div>
  </div>
</div>
