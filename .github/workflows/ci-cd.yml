name: CI and Lightsail deployment

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B spotless:check verify
        working-directory: backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --check "src/**/*.{ts,html,scss,json}"
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build -- --configuration production
        working-directory: frontend

  containers:
    name: Verify containers and publish release
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.publish.outputs.backend_image }}
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check release scripts
        run: |
          shellcheck deploy/deploy.sh deploy/backup.sh
          python3 -m unittest discover -s deploy/tests -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: spliteasy-backend:local
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          tags: spliteasy-frontend:local
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Test production stack and persistent database
        env:
          SITE_ADDRESS: ':80'
          PUBLIC_ORIGIN: http://localhost:18080
          POSTGRES_PASSWORD: ci-disposable-postgres-password
          APP_JWT_SECRET: ci-disposable-jwt-key-at-least-32-bytes
          HTTP_PORT: '127.0.0.1:18080'
          HTTPS_PORT: '127.0.0.1:18443'
        run: |
          docker compose -f compose.prod.yml config --quiet
          docker compose -f compose.prod.yml up -d --no-build --wait --wait-timeout 180
          python3 deploy/smoke.py
          docker compose -f compose.prod.yml down
          docker compose -f compose.prod.yml up -d --no-build --wait --wait-timeout 180
          python3 deploy/smoke.py verify-persistence
      - name: Clean test stack
        if: always()
        env:
          SITE_ADDRESS: ':80'
          PUBLIC_ORIGIN: http://localhost:18080
          POSTGRES_PASSWORD: ci-disposable-postgres-password
          APP_JWT_SECRET: ci-disposable-jwt-key-at-least-32-bytes
          HTTP_PORT: '127.0.0.1:18080'
          HTTPS_PORT: '127.0.0.1:18443'
        run: docker compose -f compose.prod.yml down --volumes
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images that passed smoke checks
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          base="ghcr.io/${REPOSITORY,,}"
          for component in backend frontend; do
            tag="$base-$component:$GITHUB_SHA"
            docker tag "spliteasy-$component:local" "$tag"
            docker push "$tag"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
            echo "${component}_image=$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    name: Deploy to Lightsail Mumbai
    needs: containers
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Skip a superseded main revision
        id: current
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; skipping this deployment.'
          fi
      - name: Transfer and activate release
        if: steps.current.outputs.deploy == 'true'
        env:
          SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
          SSH_USER: ${{ vars.LIGHTSAIL_USER }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          BACKEND_IMAGE: ${{ needs.containers.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.containers.outputs.frontend_image }}
        run: |
          umask 077
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          key="$RUNNER_TEMP/lightsail-key"
          hosts="$RUNNER_TEMP/lightsail-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" > release.env
          tar -czf "$RUNNER_TEMP/release.tar.gz" compose.prod.yml release.env deploy/deploy.sh deploy/backup.sh
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10)
          target="$SSH_USER@$SSH_HOST"
          remote="/opt/spliteasy/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Expand the validated release path locally; never overwrite an active release on a rerun.
          # shellcheck disable=SC2029
          ssh "${options[@]}" "$target" "mkdir '$remote'"
          scp "${options[@]}" "$RUNNER_TEMP/release.tar.gz" "$target:$remote/release.tar.gz"
          # shellcheck disable=SC2029
          ssh "${options[@]}" "$target" "tar -xzf '$remote/release.tar.gz' -C '$remote' && bash '$remote/deploy/deploy.sh'"
