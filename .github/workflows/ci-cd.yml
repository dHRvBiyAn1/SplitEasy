name: CI and Pages + Lightsail deployment

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B spotless:check verify
        working-directory: backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --check "src/**/*.{ts,html,scss,json}"
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build -- --configuration production
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-${{ github.sha }}
          path: frontend/dist/frontend/browser
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Verify containers and publish release
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.publish.outputs.backend_image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check release scripts
        run: |
          shellcheck deploy/deploy.sh deploy/backup.sh deploy/deliver.sh
          python3 -m unittest discover -s deploy/tests -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: spliteasy-backend:local
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Test private origin and persistent database
        env:
          PUBLIC_ORIGIN: https://split-easy.io
          POSTGRES_PASSWORD: ci-disposable-postgres-password
          APP_JWT_SECRET: ci-disposable-jwt-key-at-least-32-bytes
        run: |
          docker compose -f compose.prod.yml -f deploy/compose.ci.yml up -d --no-build --wait --wait-timeout 180
          python3 deploy/smoke.py
          docker compose -f compose.prod.yml -f deploy/compose.ci.yml down
          docker compose -f compose.prod.yml -f deploy/compose.ci.yml up -d --no-build --wait --wait-timeout 180
          python3 deploy/smoke.py verify-persistence
      - name: Clean disposable stack
        if: always()
        env:
          PUBLIC_ORIGIN: https://split-easy.io
          POSTGRES_PASSWORD: ci-disposable-postgres-password
          APP_JWT_SECRET: ci-disposable-jwt-key-at-least-32-bytes
        run: docker compose -f compose.prod.yml -f deploy/compose.ci.yml down --volumes
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images that passed smoke checks
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          base="ghcr.io/${REPOSITORY,,}"
          tag="$base-backend:$GITHUB_SHA"
          docker tag spliteasy-backend:local "$tag"
          docker push "$tag"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          echo "backend_image=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Lightsail Sydney
    needs: [containers, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-${{ github.sha }}
          path: frontend/dist/frontend/browser
      - name: Activate backend, then publish verified Pages artifact
        env:
          SSH_HOST: ${{ vars.LIGHTSAIL_HOST }}
          SSH_USER: ${{ vars.LIGHTSAIL_USER }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          BACKEND_IMAGE: ${{ needs.containers.outputs.backend_image }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash deploy/deliver.sh
