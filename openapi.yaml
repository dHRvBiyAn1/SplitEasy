  parameters:
    LedgerVersion:
      name: X-Ledger-Version
      in: header
      required: false
      description: Send2 for explicit minor units/multiple currencies. Missing/other values keep USD-only
        compatibility; non-USD financial reads/writes return409 upgrade guidance. Never mix old backend instances
        after non-USD data is enabled.
      schema:
        type: string
        enum:
        - '2'
    GroupIdParam:
      name: groupId
      in: path
      required: true
      description: The group ID
      schema:
        type: string
        format: uuid

  headers:
    RefreshCookie:
      description: Host-only __Host-spliteasy-refresh; Secure, HttpOnly, Path=/, SameSite=Strict. At most seven days, clipped to absolute expiry. Never place this credential in browser storage or URLs.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying the authentication request; CORS exposes this header to browser clients
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,3}$'

  responses:
    TooManyRequests:
      description: Too many attempts; wait before explicitly retrying. Process-local limits reset on restart.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: |
        Invalid request (validation failure, bad split sums, amount over cap). The
        application error body is used for handled validation errors; malformed JSON
        or other framework-level request failures may have a different body.

    Unauthorized:
      description: Missing, malformed, or expired Bearer token; body is security-filter-specific

    Forbidden:
      description: Not a member of this group (also returned for non-existent groups)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: Resource not found within the group
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: State conflict (e.g. member still has a non-zero balance)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-spliteasy-refresh
      description: Rotating HttpOnly Secure browser credential; requires trusted Origin and X-SplitEasy-Session header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /api/auth/register or /api/auth/login (HS256, 1h)
